services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=cache1
      - DB_USER=postgres
      - DB_PASSWORD=Miki.234

  cachenode:
    build:
      context: .
      dockerfile: cachenode/Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      - gateway
